# Throwaway: runs the plan row 0-12 ESLint report on this branch (the live code, da3549b)
# and commits eslint-report.json back to the branch. Never merged.
name: eslint-report
on:
  push:
    branches: [report/eslint-live]
    paths: [tools/eslint-report.mjs, .github/workflows/eslint-report.yml]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock eslint@9 globals@15 espree@10
      - run: node tools/eslint-report.mjs
      # The report travels back as annotations (gzip + base64, in chunks), readable through the API
      - run: |
          gzip -9 -c eslint-report.json | base64 -w0 > r.b64
          split -b 20000 -d -a 3 r.b64 chunk.
          N=$(ls chunk.* | wc -l); echo "::notice title=report-meta::chunks=$N bytes=$(wc -c < r.b64) sha=$(sha256sum eslint-report.json | cut -c1-16)"
      - run: |
          for f in $(ls chunk.* | sed -n '1,10p'); do echo "::warning title=$f::$(cat $f)"; done
      - run: |
          for f in $(ls chunk.* | sed -n '11,20p'); do echo "::warning title=$f::$(cat $f)"; done
      - run: |
          for f in $(ls chunk.* | sed -n '21,30p'); do echo "::warning title=$f::$(cat $f)"; done
      - run: |
          for f in $(ls chunk.* | sed -n '31,40p'); do echo "::warning title=$f::$(cat $f)"; done
      - run: |
          for f in $(ls chunk.* | sed -n '41,50p'); do echo "::warning title=$f::$(cat $f)"; done
